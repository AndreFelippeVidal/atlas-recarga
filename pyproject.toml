[project]
name = "atlas-recarga"
version = "0.0.0"
description = "Atlas Recarga — Databricks data & AI platform (workspace root)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Workspace members are added as packages are created (SPEC-009 §2, from P4.1).
# [tool.uv.workspace]
# members = ["cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is the point of tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
