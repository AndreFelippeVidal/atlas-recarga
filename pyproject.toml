[project]
name = "atlas-recarga"
version = "0.0.0"
description = "Atlas Recarga — Databricks data & AI platform (workspace root)"
requires-python = ">=3.12"
dependencies = ["atlas-cli"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Workspace members are added as packages are created (SPEC-009 §2).
[tool.uv.workspace]
members = ["cli"]

[tool.uv.sources]
atlas-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"cli/tests/**" = ["S101"]  # assert is the point of tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", ".claude/hooks", "cli/src", "cli/tests"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true  # pyarrow não publica stubs

[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests"]
addopts = "-q"
