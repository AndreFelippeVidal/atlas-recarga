[project]
name = "atlas-recarga"
version = "0.0.0"
description = "Atlas Recarga — Databricks data & AI platform (workspace root)"
requires-python = ">=3.12"
dependencies = ["atlas-cli"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

# Workspace members are added as packages are created (SPEC-009 §2).
[tool.uv.workspace]
members = ["cli"]

[tool.uv.sources]
atlas-cli = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

# Vendorizados do template oficial databricks/app-templates (agent-langgraph); não editar.
extend-exclude = ["apps/agent/scripts", "apps/agent/agent_server/utils.py", "apps/agent/agent_server/start_server.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"cli/tests/**" = ["S101"]  # assert is the point of tests
"commission/tests/**" = ["S101"]
"apps/agent/tests/**" = ["S101"]
# DDL/consultas montados só com identificadores validados e listas fechadas (SPEC-005 §3)
"semantic/apply_functions.py" = ["S608"]
"eval/monitoring.py" = ["S608"]  # DDL com o catálogo validado
"scripts/check_agent_monitoring.py" = ["S608"]
"scripts/check_agent_functions.py" = ["S608"]
"scripts/check_agent_skeleton.py" = ["S608"]
"scripts/check_agent_tools.py" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tests", ".claude/hooks", "scripts/setup_workspace.py", "scripts/check_bronze_counts.py", "scripts/check_golden_set.py", "scripts/check_agent_golden_set.py", "eval/sync_golden_set.py", "eval/scorers.py", "eval/gate.py", "eval/monitoring.py", "scripts/check_commission_append_only.py", "scripts/check_commission_draft.py", "scripts/check_commission_reconciliation.py", "scripts/check_commission_review.py", "cli/src", "cli/tests", "scripts/check_agent_skeleton.py", "commission", "apps/agent/agent_server/config.py", "apps/agent/agent_server/tools.py", "apps/agent/agent_server/prompts.py", "apps/agent/tests", "scripts/check_agent_tools.py", "scripts/check_agent_refusals.py", "scripts/check_agent_monitoring.py"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true  # pyarrow não publica stubs

[[tool.mypy.overrides]]
module = ["pyspark", "pyspark.*", "mlflow", "mlflow.*", "databricks.connect", "databricks_mcp", "databricks_langchain", "langchain_core", "langchain_core.*"]
ignore_missing_imports = true  # só existe no workspace; o import é feito dentro de main()

[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests", "commission/tests", "apps/agent/tests"]
pythonpath = [".", "apps/agent"]
addopts = "-q"
