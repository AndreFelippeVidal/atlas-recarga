# atlas.semantic.mv_recharges (SPEC-004 §3). Definição única das métricas de recarga.
# `${catalog}` é trocado por `atlas_dev` ou `atlas` em semantic/apply_metric_views.py; o resto
# vai literal para `CREATE OR REPLACE VIEW ... WITH METRICS LANGUAGE YAML`.
# Os aliases dos joins usam o prefixo `dim_` porque `pos` seria prefixo da coluna `pos_id` da
# fato (erro INVALID_EXTRACT_BASE_FIELD_TYPE); o join aninhado exige a cadeia completa.
version: 1.1
source: ${catalog}.gold.fct_recharges
comment: >-
  Recargas de celular da rede Eaí? Telecom (dados sintéticos). Grão: recarga. Receita, quantidade
  e PDVs ativos consideram só recargas aprovadas; a taxa de estorno considera todas.
joins:
  - name: dim_pos
    source: ${catalog}.gold.dim_pos
    'on': source.pos_id = dim_pos.pos_id
    joins:
      - name: dim_municipality
        source: ${catalog}.gold.dim_municipality
        'on': dim_pos.municipality_ibge_code = dim_municipality.municipality_ibge_code
      - name: dim_distributor
        source: ${catalog}.gold.dim_distributor
        'on': dim_pos.distributor_id = dim_distributor.distributor_id
dimensions:
  - name: recharge_date
    expr: source.recharge_date
    comment: Dia de negócio da recarga, em America/Sao_Paulo.
    synonyms: [data, dia]
  - name: recharge_month
    expr: DATE_TRUNC('MONTH', source.recharge_date)
    comment: Mês de negócio da recarga, em America/Sao_Paulo.
    synonyms: [mês]
  - name: recharge_year
    expr: YEAR(source.recharge_date)
    comment: >-
      Ano de negócio da recarga, em America/Sao_Paulo. Existe para o acumulado no ano zerar a cada
      janeiro; para filtrar por período use recharge_month.
    synonyms: [ano]
  - name: recharge_hour_local
    expr: source.recharge_hour_local
    comment: Hora da recarga, de 0 a 23, no fuso da UF do PDV.
    synonyms: [hora, horário, horário de pico]
  - name: region
    expr: dim_pos.dim_municipality.region
    comment: >-
      Código da região do Brasil do município do PDV: N (Norte), NE (Nordeste), CO (Centro-Oeste),
      SE (Sudeste) ou S (Sul). Filtre sempre pelo código, nunca pelo nome.
    synonyms: [região]
  - name: uf
    expr: dim_pos.dim_municipality.uf
    comment: Sigla da UF do município do PDV.
    synonyms: [estado, UF]
  - name: municipality_ibge_code
    expr: dim_pos.dim_municipality.municipality_ibge_code
    comment: Código IBGE do município do PDV, 7 dígitos.
    synonyms: [código IBGE]
  - name: municipality_name
    expr: dim_pos.dim_municipality.municipality_name
    comment: Nome do município do PDV.
    synonyms: [município, cidade]
  - name: ddd
    expr: dim_pos.dim_municipality.ddd
    comment: DDD aproximado do município do PDV.
    synonyms: [DDD, código de área]
  - name: pos_type
    expr: dim_pos.pos_type
    comment: >-
      Tipo do PDV: newsstand (banca), pharmacy (farmácia), grocery (mercearia), lottery
      (lotérica) ou partner_app (app parceiro).
    synonyms: [tipo de PDV, canal]
  - name: distributor_name
    expr: dim_pos.dim_distributor.distributor_name
    comment: Nome do distribuidor que atende o PDV.
    synonyms: [distribuidor]
measures:
  - name: gross_revenue
    expr: SUM(source.amount_brl) FILTER (WHERE source.status = 'approved')
    comment: "Receita bruta em reais (BRL): soma do valor de face das recargas aprovadas."
    synonyms: [receita, faturamento, volume]
    format:
      type: currency
      currency_code: BRL
      decimal_places:
        type: exact
        places: 2
  - name: recharge_count
    expr: COUNT(1) FILTER (WHERE source.status = 'approved')
    comment: Quantidade de recargas aprovadas.
    synonyms: [recargas, quantidade]
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: avg_ticket
    expr: MEASURE(gross_revenue) / MEASURE(recharge_count)
    comment: "Ticket médio em reais (BRL): receita bruta dividida pela quantidade de recargas aprovadas."
    synonyms: [ticket médio]
    format:
      type: currency
      currency_code: BRL
      decimal_places:
        type: exact
        places: 2
  - name: active_pos
    expr: COUNT(DISTINCT source.pos_id) FILTER (WHERE source.status = 'approved')
    comment: >-
      PDVs ativos: PDV com pelo menos 1 recarga aprovada no período filtrado.
    synonyms: [PDVs ativos]
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: revenue_per_active_pos
    expr: MEASURE(gross_revenue) / MEASURE(active_pos)
    comment: "Receita por PDV ativo em reais (BRL): receita bruta dividida pelos PDVs ativos."
    synonyms: [receita por PDV]
    format:
      type: currency
      currency_code: BRL
      decimal_places:
        type: exact
        places: 2
  - name: reversal_rate
    expr: COUNT(1) FILTER (WHERE source.status = 'reversed') / COUNT(1)
    comment: "Taxa de estorno: recargas estornadas divididas por todas as recargas (fração de 0 a 1)."
    synonyms: [taxa de estorno]
    format:
      type: percentage
      decimal_places:
        type: max
        places: 2
  - name: distinct_subscribers
    expr: COUNT(DISTINCT source.subscriber_id) FILTER (WHERE source.status = 'approved')
    comment: Assinantes distintos com pelo menos 1 recarga aprovada no período filtrado.
    synonyms: [assinantes]
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  # Medidas com janela (SPEC-004 §5, ADR-0025 ramo A). Consulte-as sempre com
  # `WHERE recharge_month = DATE'M'` e `GROUP BY` na dimensão geográfica: o filtro de mês mantém a
  # janela. Os filtros de PDV valem antes da janela. As `aux_*` são só pedaços de composição
  # (o `MEASURE()` precisa de medidas nomeadas) e não são para consumo.
  - name: aux_revenue_cur
    expr: SUM(source.amount_brl) FILTER (WHERE source.status = 'approved')
    comment: Auxiliar de gross_revenue_t3m e revenue_mom_change (receita do mês). Não consulte.
    synonyms: [auxiliar receita do mês]
    window:
      - order: recharge_month
        range: current
        semiadditive: last
  - name: aux_revenue_prev
    expr: SUM(source.amount_brl) FILTER (WHERE source.status = 'approved')
    comment: Auxiliar de revenue_mom_change (receita do mês anterior). Não consulte.
    synonyms: [auxiliar receita do mês anterior]
    window:
      - order: recharge_month
        range: trailing 1 month
        semiadditive: last
  - name: aux_revenue_trailing2
    expr: SUM(source.amount_brl) FILTER (WHERE source.status = 'approved')
    comment: >-
      Auxiliar de gross_revenue_t3m (receita dos 2 meses anteriores, sem o mês atual). Não consulte.
    synonyms: [auxiliar receita dois meses anteriores]
    window:
      - order: recharge_month
        range: trailing 2 month
        semiadditive: last
  - name: gross_revenue_t3m
    expr: COALESCE(MEASURE(aux_revenue_trailing2), 0) + COALESCE(MEASURE(aux_revenue_cur), 0)
    comment: >-
      Receita bruta em reais (BRL) dos últimos 3 meses: o mês filtrado e os 2 anteriores (janela
      móvel). Consulte com recharge_month = um mês. Vale 0,00, e não nulo, quando não há recarga
      aprovada na janela.
    synonyms: [últimos 3 meses, trimestre móvel]
    format:
      type: currency
      currency_code: BRL
      decimal_places:
        type: exact
        places: 2
  - name: gross_revenue_ytd
    expr: SUM(source.amount_brl) FILTER (WHERE source.status = 'approved')
    comment: >-
      Receita bruta em reais (BRL) acumulada de janeiro até o mês filtrado, zerando a cada janeiro
      (em janeiro é a receita de janeiro). Consulte com recharge_month = um mês.
    synonyms: [acumulado no ano, YTD]
    window:
      - order: recharge_year
        range: current
        semiadditive: last
      - order: recharge_month
        range: cumulative
        semiadditive: last
    format:
      type: currency
      currency_code: BRL
      decimal_places:
        type: exact
        places: 2
  - name: revenue_mom_change
    expr: >-
      (MEASURE(aux_revenue_cur) - MEASURE(aux_revenue_prev))
      / NULLIF(MEASURE(aux_revenue_prev), 0)
    comment: >-
      Variação da receita bruta contra o mês anterior, como fração (0,05 = 5%): (receita do mês -
      receita do mês anterior) / receita do mês anterior. Nulo sem mês anterior ou com base zero.
      Consulte com recharge_month = um mês.
    synonyms: [variação contra o mês anterior, crescimento]
    format:
      type: percentage
      decimal_places:
        type: max
        places: 4
