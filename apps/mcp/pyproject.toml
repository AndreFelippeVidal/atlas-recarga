[project]
name = "atlas-mcp"
version = "0.1.0"
description = "MCP server somente leitura do Atlas Recarga (Databricks App atlas-mcp)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
    "databricks-sdk>=0.60.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atlas_mcp"]

[project.scripts]
atlas-mcp = "atlas_mcp.server:main"
