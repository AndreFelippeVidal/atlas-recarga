[project]
name = "atlas-agent"
version = "0.1.0"
description = "Agente de negócio do Atlas Recarga (Databricks App agent-atlas)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.129.0",
    "uvicorn>=0.41.0",
    "databricks-langchain>=0.17.0",
    "databricks-mcp>=0.1.0",
    "unitycatalog-ai>=0.3.0",
    "databricks-agents>=1.9.3",
    "mlflow>=3.10.0",
    "langgraph>=1.1.0",
    "python-dotenv>=1.2.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_server", "scripts"]

[project.scripts]
start-app = "scripts.start_app:main"
start-server = "agent_server.start_server:main"
