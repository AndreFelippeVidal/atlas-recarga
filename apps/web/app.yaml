command: ['uv', 'run', 'atlas-web']
# Apps escutam em $DATABRICKS_APP_PORT (padrão 8000). O FastAPI serve /api, o build em static/ e /geo.
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: "sql-warehouse"
  - name: ATLAS_CATALOG
    value: "atlas"  # o bundle sobrescreve (atlas_dev no target dev)
