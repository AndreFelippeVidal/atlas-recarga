- id: GS-021
  category: comparison
  question: "Qual foi a variação percentual da receita da rede de setembro para outubro de 2026?"
  reference_sql: |
    WITH m AS (
      SELECT recharge_month AS ref_month, MEASURE(gross_revenue) AS v
      FROM atlas.semantic.mv_recharges
      WHERE recharge_month IN (DATE'2026-10-01', DATE'2026-09-01')
      GROUP BY recharge_month
    )
    SELECT ROUND((MAX(v) FILTER (WHERE ref_month = DATE'2026-10-01') / MAX(v) FILTER (WHERE ref_month = DATE'2026-09-01') - 1) * 100, 2) AS value
    FROM m
  expected_source_view: mv_recharges
  tolerance_pct: 1.0
