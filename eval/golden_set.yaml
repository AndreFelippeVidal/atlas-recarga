# Golden set do agente (SPEC-008 §3). Fonte de verdade; o dataset no UC é sincronizado (P9.2).
# Cada caso guarda a SQL de referência, não o número: o valor esperado é recalculado a cada rodada.
# Toda `reference_sql` deve retornar exatamente 1 valor (scripts/check_golden_set.py, no workspace).
# Mês de referência: outubro de 2026 (último mês fechado); setembro é a base dos comparativos.
- id: GS-001
  category: metric
  question: "Qual foi a receita de recarga da rede em outubro de 2026?"
  reference_sql: |
    SELECT MEASURE(gross_revenue) AS value
    FROM atlas.semantic.mv_recharges
    WHERE recharge_month = DATE'2026-10-01'
  expected_source_view: mv_recharges
  tolerance_pct: 0.5
