- id: GS-031
  category: no_period
  question: "Como foi a receita da rede?"
  # Sem mês na pergunta: o agente assume o último mês com dados e diz isso (SPEC-005 §4, regra 4).
  # Os dois SQLs olham o mês mais recente da metric view, então nada aqui fixa outubro.
  reference_sql: |
    SELECT value FROM (
      SELECT recharge_month, MEASURE(gross_revenue) AS value
      FROM atlas.semantic.mv_recharges
      GROUP BY recharge_month ORDER BY recharge_month DESC LIMIT 1
    )
  reference_month_sql: |
    SELECT CAST(recharge_month AS STRING) AS value FROM (
      SELECT recharge_month, MEASURE(gross_revenue) AS v
      FROM atlas.semantic.mv_recharges
      GROUP BY recharge_month ORDER BY recharge_month DESC LIMIT 1
    )
  expected_source_view: mv_recharges
  tolerance_pct: 0.5
