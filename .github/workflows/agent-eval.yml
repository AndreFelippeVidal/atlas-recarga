# Gate de PR do agente — SPEC-008 §5. O path filter (agente, golden set, camada semântica; nunca
# PR só de docs) fica no `changes` do `ci.yml`. Auth: ADR-0015 (Environment `ci-databricks`).
# O push na `main` registra a linha de base (tag `branch=main`) para a regra de queda de 5 pontos.
name: agent-eval

on:
  # Chamado pelo `ci.yml` (job `agent-eval`, com o path filter do job `changes`), para o `ci-ok`
  # depender dele e o gate bloquear o merge. `workflow_dispatch` serve para rodar à mão.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-eval-${{ github.ref }}
  # o push na main grava a linha de base: não cancelar
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eval:
    # Fork e Dependabot não recebem secrets de Environment: o job é pulado, não falha.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ci-databricks
    permissions:
      contents: read  # sem pull-requests: write; o comentário sai no job `comment`, sem secrets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Avaliação offline do agente
        id: evaluate
        # 1 rodada (~31 chamadas ao agente, rate limit de 30 req/min do gateway).
        run: |
          uv run --project apps/agent --locked python eval/run_offline_eval.py \
            --catalog atlas_dev \
            --warehouse-id "$DATABRICKS_WAREHOUSE_ID" \
            --genie-space-id "$ATLAS_GENIE_SPACE_ID" \
            --repeats 1 \
            --branch="$BRANCH" \
            --json-out "$RUNNER_TEMP/report.json"
        continue-on-error: true
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ vars.ATLAS_WAREHOUSE_ID }}
          ATLAS_GENIE_SPACE_ID: ${{ vars.ATLAS_GENIE_SPACE_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
      - name: Decidir o gate e montar o comentário
        id: gate
        # Sem relatório = a avaliação quebrou antes de terminar: o gate falha.
        run: |
          if [ ! -f "$RUNNER_TEMP/report.json" ]; then
            printf '%s\n### Gate do agente: ❌ falhou\n\nA avaliação não gerou resultado (veja o log do job).\n' \
              '<!-- atlas-agent-eval-gate -->' > "$RUNNER_TEMP/comment.md"
            echo "::error::a avaliação offline não gerou relatório"
            exit 1
          fi
          python3 eval/gate.py --report "$RUNNER_TEMP/report.json" --comment-out "$RUNNER_TEMP/comment.md"
      - name: Guardar o comentário
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-eval-comment
          path: ${{ runner.temp }}/comment.md
          if-no-files-found: ignore

  # Job sem secrets do Databricks: só ele tem `pull-requests: write` e não roda código do PR.
  comment:
    needs: eval
    if: always() && github.event_name == 'pull_request' && needs.eval.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-eval-comment
      - name: Criar ou atualizar o comentário do gate
        run: |
          marker='<!-- atlas-agent-eval-gate -->'
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))] | last | .id // empty")
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md
          else
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
