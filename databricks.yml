# Declarative Automation Bundle do Atlas Recarga (SPEC-002 §2, tech-stack "Deploy").
# P5.1: esqueleto. P5.2: catálogo, schemas e Volume (scripts/setup_workspace.py).
# P7.4: dashboard `atlas_visao_comercial` (AI/BI sobre atlas.semantic.mv_recharges).
# P7.5: Genie Space `atlas_recarga`. P8.11: fontes mv_recharges e mv_commission (página Comissão no dashboard).
# P8.2: job `atlas_commission_deploy` (tabelas de commission.*; não executa o review).
# P8.3: job `atlas_commission_draft` (cria o rascunho COM-YYYY-MM-v1; não aprova nada).
# P8.4: o mesmo job ganha a task `reconcile_draft` (SQL independente; grava commission.reconciliation).
# P8.5: o mesmo job ganha a task `flag_draft` (flags de revisão em commission.batch_lines).
# P8.6: job `atlas_commission_review` (uma transição por execução; só uma pessoa dispara, nunca um agente).
# P8.7: a aprovação final também trava o lote e grava a remessa; o job de deploy cria o Volume `commission.remittance`.
# P8.8: dashboard `commission_review` (lê só commission.*; filtro por lote) e notebook commission/commission_review.py.
# P11.4: experiment `atlas_mcp_traces` e dashboard `mcp_usage` (traces e uso do `atlas-mcp`).
# P10.8: job `atlas_agent_monitoring` (07:00; pontua os traces do agente), dashboard `agent_quality` e SQL alert.
# P9.2: job `atlas_eval_sync` (golden set do YAML para <catalog>.eval.agent_golden_set).
# P7.1: job `atlas_semantic_deploy` (metric views de semantic/*.yaml); P10.1: + UC functions fn_* do agente.
# P6.1: pipeline `atlas_medallion` (um só, serverless; a Free Edition permite 1 ativo por tipo).
# O host e a autenticação não ficam aqui: use `--profile <nome>` localmente e
# DATABRICKS_HOST/DATABRICKS_TOKEN no CI (ADR-0015).
bundle:
  name: atlas-recarga

variables:
  catalog:
    description: Catálogo do Unity Catalog onde o bundle cria os objetos.
  allow_same_approver_demo:
    description: Contingência da SPEC-003 §9 (mesmo ator nas 2 aprovações; marca o lote demo_mode). Só muda com um novo deploy do mantenedor; nunca é parâmetro de execução.
    default: "false"
  warehouse_id:
    description: SQL warehouse que executa as queries do dashboard (P7.4). Definido por target.
  agent_url:
    description: URL do App agent-atlas, para o chat do atlas-web (ADR-0023). Literal porque `${resources.apps.agent_atlas.url}` chega vazio ao config do outro App no deploy; a URL é fixa por nome de App e workspace.
    default: https://agent-atlas-7474657271994643.aws.databricksapps.com

resources:
  dashboards:
    atlas_visao_comercial:
      display_name: "Atlas — Visão Comercial"
      file_path: semantic/dashboards/atlas_visao_comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Os datasets usam nomes curtos (mv_recharges); o catálogo muda por target (SPEC-004 §6).
      dataset_catalog: ${var.catalog}
      dataset_schema: semantic

    commission_review:
      display_name: "Atlas — Revisão de Comissão"
      file_path: semantic/dashboards/commission_review.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Relatório do próprio domínio (SPEC-003 §5.4): lê commission.*, não consome semantic.
      dataset_catalog: ${var.catalog}
      dataset_schema: commission

    agent_quality:
      display_name: "Atlas — Qualidade do agente"
      file_path: semantic/dashboards/agent_quality.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # P10.8 (SPEC-008 §6): lê só as views de observability do próprio agente, não o semantic.
      dataset_catalog: ${var.catalog}
      dataset_schema: observability

    # P11.4 (SPEC-006 §6): página "Uso do MCP"; lê só a view de observability do próprio MCP.
    mcp_usage:
      display_name: "Atlas — Uso do MCP"
      file_path: semantic/dashboards/mcp_usage.lvdash.json
      warehouse_id: ${var.warehouse_id}
      dataset_catalog: ${var.catalog}
      dataset_schema: observability

  alerts:
    agent_quality_below_90:
      display_name: "Atlas — Qualidade do agente abaixo de 90%"
      custom_summary: "Média de 7 dias de cites_metric_view ou read_only_tools abaixo de 90%"
      custom_description: "SPEC-008 §6. Veja o dashboard Atlas — Qualidade do agente e a fila atlas.eval.review_queue."
      warehouse_id: ${var.warehouse_id}
      query_text: "SELECT scorer, pass_rate_7d FROM ${var.catalog}.observability.agent_quality_alert"
      evaluation:
        comparison_operator: LESS_THAN
        source:
          name: pass_rate_7d
          aggregation: MIN
        threshold:
          value:
            double_value: 0.9
        notification:
          notify_on_ok: false
          # Quem faz o deploy do bundle (o dono); sem e-mail fixo no repositório.
          subscriptions:
            - user_email: ${workspace.current_user.userName}
      schedule:
        quartz_cron_schedule: "0 30 7 * * ?"
        timezone_id: America/Sao_Paulo

  genie_spaces:
    atlas_recarga:
      title: "Atlas Recarga"
      description: "Perguntas em português sobre as recargas da rede Eaí? Telecom (dados sintéticos). Fontes: as metric views mv_recharges (receita, quantidade, ticket médio, PDVs ativos e taxa de estorno por região, UF, DDD, tipo de PDV e distribuidor) e mv_commission (comissão paga dos lotes travados)."
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/${workspace.current_user.userName}/atlas_genie
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "00000000000000000000000000000001"
              question: ["Qual a receita total em outubro de 2026?"]
            - id: "00000000000000000000000000000002"
              question: ["Qual a receita por DDD em outubro?"]
            - id: "00000000000000000000000000000003"
              question: ["Qual a receita por região em outubro?"]
            - id: "00000000000000000000000000000004"
              question: ["Quais as 5 UFs com maior receita em outubro?"]
            - id: "00000000000000000000000000000005"
              question: ["Qual o ticket médio por tipo de PDV em outubro?"]
        data_sources:
          tables:
            - identifier: ${var.catalog}.semantic.mv_commission
            - identifier: ${var.catalog}.semantic.mv_recharges
              column_configs:
                - column_name: distributor_name
                  enable_entity_matching: true
                  enable_format_assistance: true
                - column_name: pos_type
                  enable_entity_matching: true
                  enable_format_assistance: true
                - column_name: region
                  enable_entity_matching: true
                  enable_format_assistance: true
                - column_name: uf
                  enable_entity_matching: true
                  enable_format_assistance: true
        instructions:
          example_question_sqls:
            - id: "0000000000000000000000000000000b"
              question: ["Qual a receita total em outubro de 2026?"]
              sql: ["SELECT MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01'"]
            - id: "0000000000000000000000000000000c"
              question: ["Qual a receita por DDD em outubro?"]
              sql: ["SELECT mv_recharges.ddd, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.ddd ORDER BY gross_revenue DESC"]
            - id: "0000000000000000000000000000000d"
              question: ["Qual a receita por região em outubro?"]
              sql: ["SELECT mv_recharges.region, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.region ORDER BY gross_revenue DESC"]
            - id: "0000000000000000000000000000000e"
              question: ["Quais as 5 UFs com maior receita em outubro?"]
              sql: ["SELECT mv_recharges.uf, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.uf ORDER BY gross_revenue DESC LIMIT 5"]
            - id: "0000000000000000000000000000000f"
              question: ["Qual o ticket médio por tipo de PDV em outubro?"]
              sql: ["SELECT mv_recharges.pos_type, MEASURE(mv_recharges.avg_ticket) AS avg_ticket FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.pos_type ORDER BY avg_ticket DESC"]
            - id: "00000000000000000000000000000010"
              question: ["Quantos PDVs ativos tivemos em outubro, por região?"]
              sql: ["SELECT mv_recharges.region, MEASURE(mv_recharges.active_pos) AS active_pos FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.region ORDER BY active_pos DESC"]
            - id: "00000000000000000000000000000011"
              question: ["Qual a taxa de estorno por UF em outubro?"]
              sql: ["SELECT mv_recharges.uf, MEASURE(mv_recharges.reversal_rate) AS reversal_rate FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.uf ORDER BY reversal_rate DESC"]
            - id: "00000000000000000000000000000012"
              question: ["Qual a receita por distribuidor em outubro?"]
              sql: ["SELECT mv_recharges.distributor_name, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.distributor_name ORDER BY gross_revenue DESC"]
            - id: "00000000000000000000000000000013"
              question: ["Em que horário do dia a receita é maior?"]
              sql: ["SELECT mv_recharges.recharge_hour_local, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges GROUP BY mv_recharges.recharge_hour_local ORDER BY gross_revenue DESC"]
            - id: "00000000000000000000000000000014"
              question: ["Como a receita de outubro variou contra setembro, por região?"]
              sql: ["WITH monthly AS (SELECT mv_recharges.region, mv_recharges.recharge_month, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month IN (DATE'2026-09-01', DATE'2026-10-01') GROUP BY mv_recharges.region, mv_recharges.recharge_month) SELECT cur.region, prev.gross_revenue AS september, cur.gross_revenue AS october, ROUND((cur.gross_revenue - prev.gross_revenue) / prev.gross_revenue * 100, 2) AS change_pct FROM monthly cur JOIN monthly prev ON cur.region = prev.region AND cur.recharge_month = DATE'2026-10-01' AND prev.recharge_month = DATE'2026-09-01' ORDER BY change_pct"]
          text_instructions:
            - id: "0000000000000000000000000000001f"
              content:
                - "## PURPOSE"
                - "- Responder, em português, sobre recargas de celular da Eaí? Telecom (dados sintéticos), usando só as metric views mv_recharges e mv_commission."
                - ""
                - "## DISAMBIGUATION"
                - "- Receita, faturamento e volume significam a medida gross_revenue; ticket médio é avg_ticket; taxa de estorno é reversal_rate."
                - "- PDV ativo é o PDV com pelo menos 1 recarga aprovada no período filtrado (medida active_pos)."
                - "- Sem período na pergunta, use o último mês fechado (2026-10) e diga qual mês usou."
                - "- A coluna region guarda siglas: N, NE, CO, SE, S. A coluna uf guarda a sigla da UF."
                - "- Para variação contra o mês anterior, consulte os dois meses e calcule a diferença na consulta; não existe medida de variação."
                - ""
                - "## CONSTRAINTS"
                - "- Comissão é a medida commission_total de mv_commission (base: commission_base; taxa efetiva: effective_rate; beneficiários: paid_beneficiaries). Só existem lotes travados; rascunhos não aparecem. O mês fica em reference_month."
                - "- commission_base e effective_rate são só dos PDVs. Linhas de distribuidor não têm uf, region, municipality_name nem tier: por UF, região ou faixa a soma fica menor que commission_total; diga isso. Lotes COM-AAAA-MM-ADJ-n são ajustes (diferenças, podem ser negativas)."
                - "- Responda só com dados de mv_recharges e mv_commission; outro assunto está fora do escopo deste Space."
                - "- Use MEASURE() para toda medida; nunca recalcule receita, ticket ou taxa à mão."
                - ""
                - "## Instructions you must follow when providing summaries"
                - "- Valores em reais com 2 casas decimais; taxas em percentual com 2 casas."
                - "- Sempre informe o mês ou período usado."

  # P10.2: App do agente (SPEC-005). O prefixo `agent-` lista o App em AI Gateway > Agents (S0.2).
  # Sem tools ainda (P10.3). O service principal do App precisa de acesso ao model service
  # system.ai.gpt-oss-120b no Unity Gateway; permissão de serving endpoint não vale (S0.1) e é
  # concedida pelo mantenedor no workspace (ver apps/agent/README.md).
  experiments:
    atlas_agent:
      name: /Shared/atlas/agent
    # P10.5: o trace location UC só liga a um experiment sem traces (ADR-0021). O App grava aqui;
    # o `atlas_agent` guarda o histórico de teste e o dataset do golden set.
    atlas_agent_traces:
      name: /Shared/atlas/agent-traces
    # P11.4 (SPEC-006 §6): traces do `atlas-mcp`. Experiment novo, sem traces, pelo mesmo motivo do
    # agente: o trace location UC (`scripts/setup_mcp_trace_tables.py`) só liga a um experiment limpo.
    atlas_mcp_traces:
      name: /Shared/atlas/mcp

  # P10.5 (ADR-0021): model service próprio do agente, com destino system.ai.gpt-oss-120b. O serviço
  # de sistema é compartilhado e não se altera. O gateway só vê o service principal do App como
  # requester, então o limite de 30 req/min vale para o App inteiro. O teto de tokens por hora é o
  # freio de gasto (pior turno medido na P10.2: 143.841 tokens); o aviso mensal é o orçamento de
  # conta (apps/agent/README.md). Não há guardrail de PII no gateway: o filtro fica no App.
  model_services:
    agent_llm:
      parent: schemas/${var.catalog}.observability
      model_service_id: agent_llm
      comment: "LLM do agent-atlas (SPEC-005, ADR-0021): rate limit, freio de tokens e inference table"
      config:
        routing:
          destinations:
            - name: primary
              destination_type: DESTINATION_TYPE_PAY_PER_TOKEN_FOUNDATION_MODEL
              pay_per_token_config:
                model: models/system.ai.gpt-oss-120b
        rate_limits:
          - key: RATE_LIMIT_KEY_USER_DEFAULT
            renewal_period: RATE_LIMIT_RENEWAL_PERIOD_MINUTE
            requests: 30
          - key: RATE_LIMIT_KEY_SERVICE
            renewal_period: RATE_LIMIT_RENEWAL_PERIOD_HOUR
            tokens: 500000
        inference_table:
          parent: schemas/${var.catalog}.observability
          table_name_prefix: agent_llm
      grants:
        - principal: ${resources.apps.agent_atlas.service_principal_client_id}
          privileges:
            - EXECUTE

  apps:
    agent_atlas:
      name: agent-atlas
      description: "Agente de negócio do Atlas Recarga (somente leitura; LLM via Unity Gateway)"
      source_code_path: ./apps/agent
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
          - name: ATLAS_GATEWAY_MODE
            value: "unity"
          - name: ATLAS_LLM_SERVICE
            value: ${var.catalog}.observability.agent_llm
          - name: ATLAS_LLM_REQUEST_TAGS
            value: "1"
          - name: ATLAS_CATALOG
            value: ${var.catalog}
          - name: ATLAS_GENIE_SPACE_ID
            value_from: "genie-space"
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: "sql-warehouse"
      resources:
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.atlas_agent_traces.id}
            permission: CAN_EDIT
        - name: genie-space
          genie_space:
            name: "Atlas Recarga"
            space_id: ${resources.genie_spaces.atlas_recarga.id}
            permission: CAN_RUN
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

    # App do MCP (SPEC-006, ADR-0008). Os dados são lidos como o usuário (on-behalf-of, escopo
    # `sql`), então o `SELECT` em `semantic` é o do próprio usuário. O service principal só
    # consulta o estado do warehouse no `health` (CAN_USE).
    atlas_mcp:
      name: atlas-mcp
      description: "MCP server somente leitura do Atlas Recarga (FastMCP)"
      source_code_path: ./apps/mcp
      user_api_scopes:
        - sql
      config:
        command: ["uv", "run", "atlas-mcp"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: "sql-warehouse"
          - name: ATLAS_CATALOG
            value: ${var.catalog}
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        # Só o experiment do MCP (objeto do workspace, não dado do UC): grava os traces.
        - name: experiment
          experiment:
            experiment_id: ${resources.experiments.atlas_mcp_traces.id}
            permission: CAN_EDIT

    # App do dashboard (SPEC-007, P12.8). Lê só `semantic` com o service principal do App, por `MEASURE()`;
    # o `SELECT` em `semantic` é concedido por principal (ADR-0016): `scripts/setup_workspace.py --reader
    # <client id do App>`. O App serve o build do React em apps/web/static e as malhas em apps/web/public/geo.
    atlas_web:
      name: atlas-web
      description: "Dashboard com mapa do Brasil do Atlas Recarga (FastAPI + React)"
      source_code_path: ./apps/web
      user_api_scopes:
        - apps
      config:
        command: ["uv", "run", "atlas-web"]
        env:
          - name: DATABRICKS_WAREHOUSE_ID
            value_from: "sql-warehouse"
          - name: ATLAS_CATALOG
            value: ${var.catalog}
          # Chat (ADR-0023): o /api/chat repassa ao agent-atlas com o token do usuário (OBO, escopo
          # `apps` = acesso App a App). O CAN_USE do usuário no agente é do workspace, não do SP do web.
          - name: ATLAS_AGENT_URL
            value: ${var.agent_url}
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

  pipelines:
    atlas_medallion:
      name: atlas_medallion
      catalog: ${var.catalog}
      schema: bronze  # default; os datasets das outras camadas virão qualificados (silver.x, gold.x)
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: pipeline/bronze.py
        - file:
            path: pipeline/silver.py
        - file:
            path: pipeline/gold.py
      configuration:
        atlas.landing_path: /Volumes/${var.catalog}/raw/landing

  jobs:
    atlas_daily:
      name: atlas_daily
      description: "Refresh do pipeline e verificação de frescor (SPEC-002 §2). A task de comissão (dia 1º) entra com a SPEC-003."
      # 06:00 em Brasília; o gold D-1 deve estar pronto antes das 08:00 (timeout de 90 min).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
      timeout_seconds: 5400
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.atlas_medallion.id}
            full_refresh: false
        - task_key: check_freshness
          depends_on:
            - task_key: refresh_pipeline
          environment_key: default
          spark_python_task:
            python_file: pipeline/freshness.py
            parameters:
              - ${var.catalog}

    atlas_semantic_deploy:
      name: atlas_semantic_deploy
      description: "Aplica as metric views de semantic/*.yaml e as UC functions fn_* do agente (SPEC-005 §3) em <catalog>.semantic (SPEC-004 §2). Sob demanda: rode depois do gold existir e a cada mudança nos YAMLs."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - pyyaml
      tasks:
        - task_key: apply_metric_views
          environment_key: default
          spark_python_task:
            python_file: semantic/apply_metric_views.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/semantic
        # P10.1: UC functions do agente (SPEC-005 §3); chamam as metric views, então vêm depois.
        - task_key: apply_agent_functions
          depends_on:
            - task_key: apply_metric_views
          environment_key: default
          spark_python_task:
            python_file: semantic/apply_functions.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/semantic

    atlas_eval_sync:
      name: atlas_eval_sync
      description: "Sincroniza eval/golden_set.yaml com o dataset MLflow <catalog>.eval.agent_golden_set (SPEC-008 §3). Sob demanda e idempotente: rode depois de mudar o YAML. Não roda o agente nem a avaliação."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "mlflow[databricks]>=3.9.0"
              - pyyaml
      tasks:
        - task_key: sync_golden_set
          environment_key: default
          spark_python_task:
            python_file: eval/sync_golden_set.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/eval/golden_set.yaml

    atlas_agent_monitoring:
      name: atlas_agent_monitoring
      description: "Pontua os traces reais do agente (SPEC-008 §6, P10.8): scorers de código em 100% e LLM judges em 20%. Grava observability.agent_quality_* e a fila eval.review_queue. Idempotente; só lê traces e escreve nas próprias tabelas."
      # 07:00 em Brasília, depois do atlas_daily (06:00).
      schedule:
        quartz_cron_expression: "0 0 7 * * ?"
        timezone_id: America/Sao_Paulo
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - "mlflow[databricks]>=3.9.0"
      tasks:
        - task_key: score_traces
          environment_key: default
          spark_python_task:
            python_file: eval/run_agent_monitoring.py
            parameters:
              - ${var.catalog}
              - --warehouse-id
              - ${var.warehouse_id}
              - --eval-dir
              - ${workspace.file_path}/eval
              # No dev o bundle prefixa o nome do experiment; o id é o que vale.
              - --experiment-id
              - ${resources.experiments.atlas_agent_traces.id}

    atlas_commission_deploy:
      name: atlas_commission_deploy
      description: "Cria as tabelas e o Volume da remessa de <catalog>.commission a partir de commission/ddl (SPEC-003 §3 e §6). Sob demanda e idempotente; não calcula nem aprova lotes."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: apply_ddl
          environment_key: default
          spark_python_task:
            python_file: commission/apply_ddl.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/commission/ddl

    atlas_commission_draft:
      name: atlas_commission_draft
      description: "Calcula o rascunho COM-YYYY-MM-v1 do mês anterior (ou de reference_month) em <catalog>.commission, status draft (SPEC-003 §2-§4). Recusa se o lote já existe; em seguida reconcilia por SQL independente sobre fct_recharges (R$ 0,00) e grava commission.reconciliation; não aprova."
      max_concurrent_runs: 1
      parameters:
        - name: reference_month
          default: ""
        - name: adjust_batch_id
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: calculate_draft
          environment_key: default
          spark_python_task:
            python_file: commission/draft.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}
              - "{{job.parameters.reference_month}}"
              - "{{job.parameters.adjust_batch_id}}"

        - task_key: reconcile_draft
          depends_on:
            - task_key: calculate_draft
          environment_key: default
          spark_python_task:
            python_file: commission/reconcile.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}
              - "{{job.parameters.reference_month}}"
              - "{{job.parameters.adjust_batch_id}}"

        - task_key: flag_draft
          depends_on:
            - task_key: reconcile_draft
          environment_key: default
          spark_python_task:
            python_file: commission/flags.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}
              - "{{job.parameters.reference_month}}"
              - "{{job.parameters.adjust_batch_id}}"

    atlas_commission_review:
      name: atlas_commission_review
      description: "Uma transição da máquina de estados do lote de comissão por execução (SPEC-003 §4): submit (draft -> under_review), approve (analista, depois diretora, atores distintos) ou reject (justificativa de 20+ caracteres). Disparo manual por uma pessoa; nenhum agente, MCP ou app executa este job (ADR-0010). A aprovação final faz o lock e a remessa simulada na mesma execução (P8.7)."
      max_concurrent_runs: 1
      parameters:
        - name: batch_id
          default: ""
        - name: decision
          default: ""
        - name: justification
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: review_batch
          environment_key: default
          spark_python_task:
            python_file: commission/review.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}
              - "{{job.parameters.batch_id}}"
              - "{{job.parameters.decision}}"
              - "{{job.parameters.justification}}"
              - "{{job.run_id}}"
              - ${var.allow_same_approver_demo}

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: atlas_dev
      warehouse_id: af0a1dbe08dd5514

  demo:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: atlas
      warehouse_id: af0a1dbe08dd5514
