# Declarative Automation Bundle do Atlas Recarga (SPEC-002 §2, tech-stack "Deploy").
# P5.1: esqueleto. P5.2: catálogo, schemas e Volume (scripts/setup_workspace.py).
# P7.4: dashboard `atlas_visao_comercial` (AI/BI sobre atlas.semantic.mv_recharges).
# P7.5: Genie Space `atlas_recarga` (só mv_recharges; mv_commission entra na P8.11).
# P8.2: job `atlas_commission_deploy` (tabelas de commission.*; não executa o review).
# P8.3: job `atlas_commission_draft` (cria o rascunho COM-YYYY-MM-v1; não aprova nada).
# P7.1: job `atlas_semantic_deploy` (metric views de semantic/*.yaml).
# P6.1: pipeline `atlas_medallion` (um só, serverless; a Free Edition permite 1 ativo por tipo).
# O host e a autenticação não ficam aqui: use `--profile <nome>` localmente e
# DATABRICKS_HOST/DATABRICKS_TOKEN no CI (ADR-0015).
bundle:
  name: atlas-recarga

variables:
  catalog:
    description: Catálogo do Unity Catalog onde o bundle cria os objetos.
  warehouse_id:
    description: SQL warehouse que executa as queries do dashboard (P7.4). Definido por target.

resources:
  dashboards:
    atlas_visao_comercial:
      display_name: "Atlas — Visão Comercial"
      file_path: semantic/dashboards/atlas_visao_comercial.lvdash.json
      warehouse_id: ${var.warehouse_id}
      # Os datasets usam nomes curtos (mv_recharges); o catálogo muda por target (SPEC-004 §6).
      dataset_catalog: ${var.catalog}
      dataset_schema: semantic

  genie_spaces:
    atlas_recarga:
      title: "Atlas Recarga"
      description: "Perguntas em português sobre as recargas da rede Eaí? Telecom (dados sintéticos). Fonte única: a metric view mv_recharges, com receita, quantidade, ticket médio, PDVs ativos e taxa de estorno por região, UF, DDD, tipo de PDV e distribuidor."
      warehouse_id: ${var.warehouse_id}
      parent_path: /Workspace/Users/${workspace.current_user.userName}/atlas_genie
      serialized_space:
        version: 2
        config:
          sample_questions:
            - id: "00000000000000000000000000000001"
              question: ["Qual a receita total em outubro de 2026?"]
            - id: "00000000000000000000000000000002"
              question: ["Qual a receita por DDD em outubro?"]
            - id: "00000000000000000000000000000003"
              question: ["Qual a receita por região em outubro?"]
            - id: "00000000000000000000000000000004"
              question: ["Quais as 5 UFs com maior receita em outubro?"]
            - id: "00000000000000000000000000000005"
              question: ["Qual o ticket médio por tipo de PDV em outubro?"]
        data_sources:
          tables:
            - identifier: ${var.catalog}.semantic.mv_recharges
              column_configs:
                - column_name: distributor_name
                  enable_entity_matching: true
                  enable_format_assistance: true
                - column_name: pos_type
                  enable_entity_matching: true
                  enable_format_assistance: true
                - column_name: region
                  enable_entity_matching: true
                  enable_format_assistance: true
                - column_name: uf
                  enable_entity_matching: true
                  enable_format_assistance: true
        instructions:
          example_question_sqls:
            - id: "0000000000000000000000000000000b"
              question: ["Qual a receita total em outubro de 2026?"]
              sql: ["SELECT MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01'"]
            - id: "0000000000000000000000000000000c"
              question: ["Qual a receita por DDD em outubro?"]
              sql: ["SELECT mv_recharges.ddd, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.ddd ORDER BY gross_revenue DESC"]
            - id: "0000000000000000000000000000000d"
              question: ["Qual a receita por região em outubro?"]
              sql: ["SELECT mv_recharges.region, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.region ORDER BY gross_revenue DESC"]
            - id: "0000000000000000000000000000000e"
              question: ["Quais as 5 UFs com maior receita em outubro?"]
              sql: ["SELECT mv_recharges.uf, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.uf ORDER BY gross_revenue DESC LIMIT 5"]
            - id: "0000000000000000000000000000000f"
              question: ["Qual o ticket médio por tipo de PDV em outubro?"]
              sql: ["SELECT mv_recharges.pos_type, MEASURE(mv_recharges.avg_ticket) AS avg_ticket FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.pos_type ORDER BY avg_ticket DESC"]
            - id: "00000000000000000000000000000010"
              question: ["Quantos PDVs ativos tivemos em outubro, por região?"]
              sql: ["SELECT mv_recharges.region, MEASURE(mv_recharges.active_pos) AS active_pos FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.region ORDER BY active_pos DESC"]
            - id: "00000000000000000000000000000011"
              question: ["Qual a taxa de estorno por UF em outubro?"]
              sql: ["SELECT mv_recharges.uf, MEASURE(mv_recharges.reversal_rate) AS reversal_rate FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.uf ORDER BY reversal_rate DESC"]
            - id: "00000000000000000000000000000012"
              question: ["Qual a receita por distribuidor em outubro?"]
              sql: ["SELECT mv_recharges.distributor_name, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month = DATE'2026-10-01' GROUP BY mv_recharges.distributor_name ORDER BY gross_revenue DESC"]
            - id: "00000000000000000000000000000013"
              question: ["Em que horário do dia a receita é maior?"]
              sql: ["SELECT mv_recharges.recharge_hour_local, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges GROUP BY mv_recharges.recharge_hour_local ORDER BY gross_revenue DESC"]
            - id: "00000000000000000000000000000014"
              question: ["Como a receita de outubro variou contra setembro, por região?"]
              sql: ["WITH monthly AS (SELECT mv_recharges.region, mv_recharges.recharge_month, MEASURE(mv_recharges.gross_revenue) AS gross_revenue FROM ${var.catalog}.semantic.mv_recharges AS mv_recharges WHERE mv_recharges.recharge_month IN (DATE'2026-09-01', DATE'2026-10-01') GROUP BY mv_recharges.region, mv_recharges.recharge_month) SELECT cur.region, prev.gross_revenue AS september, cur.gross_revenue AS october, ROUND((cur.gross_revenue - prev.gross_revenue) / prev.gross_revenue * 100, 2) AS change_pct FROM monthly cur JOIN monthly prev ON cur.region = prev.region AND cur.recharge_month = DATE'2026-10-01' AND prev.recharge_month = DATE'2026-09-01' ORDER BY change_pct"]
          text_instructions:
            - id: "0000000000000000000000000000001f"
              content:
                - "## PURPOSE"
                - "- Responder, em português, sobre recargas de celular da Eaí? Telecom (dados sintéticos), usando só a metric view mv_recharges."
                - ""
                - "## DISAMBIGUATION"
                - "- Receita, faturamento e volume significam a medida gross_revenue; ticket médio é avg_ticket; taxa de estorno é reversal_rate."
                - "- PDV ativo é o PDV com pelo menos 1 recarga aprovada no período filtrado (medida active_pos)."
                - "- Sem período na pergunta, use o último mês fechado (2026-10) e diga qual mês usou."
                - "- A coluna region guarda siglas: N, NE, CO, SE, S. A coluna uf guarda a sigla da UF."
                - "- Para variação contra o mês anterior, consulte os dois meses e calcule a diferença na consulta; não existe medida de variação."
                - ""
                - "## CONSTRAINTS"
                - "- Responda só com dados de mv_recharges; se a pergunta pedir comissão ou outro assunto, diga que está fora do escopo deste Space."
                - "- Use MEASURE() para toda medida; nunca recalcule receita, ticket ou taxa à mão."
                - ""
                - "## Instructions you must follow when providing summaries"
                - "- Valores em reais com 2 casas decimais; taxas em percentual com 2 casas."
                - "- Sempre informe o mês ou período usado."

  pipelines:
    atlas_medallion:
      name: atlas_medallion
      catalog: ${var.catalog}
      schema: bronze  # default; os datasets das outras camadas virão qualificados (silver.x, gold.x)
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: pipeline/bronze.py
        - file:
            path: pipeline/silver.py
        - file:
            path: pipeline/gold.py
      configuration:
        atlas.landing_path: /Volumes/${var.catalog}/raw/landing

  jobs:
    atlas_daily:
      name: atlas_daily
      description: "Refresh do pipeline e verificação de frescor (SPEC-002 §2). A task de comissão (dia 1º) entra com a SPEC-003."
      # 06:00 em Brasília; o gold D-1 deve estar pronto antes das 08:00 (timeout de 90 min).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
      timeout_seconds: 5400
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.atlas_medallion.id}
            full_refresh: false
        - task_key: check_freshness
          depends_on:
            - task_key: refresh_pipeline
          environment_key: default
          spark_python_task:
            python_file: pipeline/freshness.py
            parameters:
              - ${var.catalog}

    atlas_semantic_deploy:
      name: atlas_semantic_deploy
      description: "Aplica as metric views de semantic/*.yaml em <catalog>.semantic (SPEC-004 §2). Sob demanda: rode depois do gold existir e a cada mudança nos YAMLs."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: apply_metric_views
          environment_key: default
          spark_python_task:
            python_file: semantic/apply_metric_views.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/semantic

    atlas_commission_deploy:
      name: atlas_commission_deploy
      description: "Cria as tabelas de <catalog>.commission a partir de commission/ddl/*.sql (SPEC-003 §3). Sob demanda e idempotente; não calcula nem aprova lotes."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: apply_ddl
          environment_key: default
          spark_python_task:
            python_file: commission/apply_ddl.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/commission/ddl

    atlas_commission_draft:
      name: atlas_commission_draft
      description: "Calcula o rascunho COM-YYYY-MM-v1 do mês anterior (ou de reference_month) em <catalog>.commission, status draft (SPEC-003 §2-§4). Recusa se o lote já existe; não reconcilia nem aprova."
      max_concurrent_runs: 1
      parameters:
        - name: reference_month
          default: ""
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: calculate_draft
          environment_key: default
          spark_python_task:
            python_file: commission/draft.py
            parameters:
              - ${var.catalog}
              - "{{job.parameters.reference_month}}"

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: atlas_dev
      warehouse_id: af0a1dbe08dd5514

  demo:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: atlas
      warehouse_id: af0a1dbe08dd5514
