# Declarative Automation Bundle do Atlas Recarga (SPEC-002 §2, tech-stack "Deploy").
# P5.1: esqueleto. P5.2: catálogo, schemas e Volume (scripts/setup_workspace.py).
# P6.1: pipeline `atlas_medallion` (um só, serverless; a Free Edition permite 1 ativo por tipo).
# O host e a autenticação não ficam aqui: use `--profile <nome>` localmente e
# DATABRICKS_HOST/DATABRICKS_TOKEN no CI (ADR-0015).
bundle:
  name: atlas-recarga

variables:
  catalog:
    description: Catálogo do Unity Catalog onde o bundle cria os objetos.

resources:
  pipelines:
    atlas_medallion:
      name: atlas_medallion
      catalog: ${var.catalog}
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: pipeline/bronze.py
      configuration:
        atlas.landing_path: /Volumes/${var.catalog}/raw/landing

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: atlas_dev

  demo:
    mode: production
    variables:
      catalog: atlas
