# Declarative Automation Bundle do Atlas Recarga (SPEC-002 §2, tech-stack "Deploy").
# P5.1: esqueleto. P5.2: catálogo, schemas e Volume (scripts/setup_workspace.py).
# P7.1: job `atlas_semantic_deploy` (metric views de semantic/*.yaml).
# P6.1: pipeline `atlas_medallion` (um só, serverless; a Free Edition permite 1 ativo por tipo).
# O host e a autenticação não ficam aqui: use `--profile <nome>` localmente e
# DATABRICKS_HOST/DATABRICKS_TOKEN no CI (ADR-0015).
bundle:
  name: atlas-recarga

variables:
  catalog:
    description: Catálogo do Unity Catalog onde o bundle cria os objetos.

resources:
  pipelines:
    atlas_medallion:
      name: atlas_medallion
      catalog: ${var.catalog}
      schema: bronze  # default; os datasets das outras camadas virão qualificados (silver.x, gold.x)
      serverless: true
      channel: CURRENT
      libraries:
        - file:
            path: pipeline/bronze.py
        - file:
            path: pipeline/silver.py
        - file:
            path: pipeline/gold.py
      configuration:
        atlas.landing_path: /Volumes/${var.catalog}/raw/landing

  jobs:
    atlas_daily:
      name: atlas_daily
      description: "Refresh do pipeline e verificação de frescor (SPEC-002 §2). A task de comissão (dia 1º) entra com a SPEC-003."
      # 06:00 em Brasília; o gold D-1 deve estar pronto antes das 08:00 (timeout de 90 min).
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: America/Sao_Paulo
      timeout_seconds: 5400
      max_concurrent_runs: 1
      email_notifications:
        on_failure:
          - ${workspace.current_user.userName}
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: refresh_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.atlas_medallion.id}
            full_refresh: false
        - task_key: check_freshness
          depends_on:
            - task_key: refresh_pipeline
          environment_key: default
          spark_python_task:
            python_file: pipeline/freshness.py
            parameters:
              - ${var.catalog}

    atlas_semantic_deploy:
      name: atlas_semantic_deploy
      description: "Aplica as metric views de semantic/*.yaml em <catalog>.semantic (SPEC-004 §2). Sob demanda: rode depois do gold existir e a cada mudança nos YAMLs."
      max_concurrent_runs: 1
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      tasks:
        - task_key: apply_metric_views
          environment_key: default
          spark_python_task:
            python_file: semantic/apply_metric_views.py
            parameters:
              - ${var.catalog}
              - ${workspace.file_path}/semantic

targets:
  dev:
    default: true
    mode: development
    variables:
      catalog: atlas_dev

  demo:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: atlas
